question = "Q9"
points = 2
text = "Step 3 does not comply: an employee with career tenure who is on probation only as a new supervisor is not serving an 'initial probationary period' (the 351.203 definition excludes the supervisory or managerial probationary period of part 315, subpart I; the preamble at 91 FR 49191 says such an employee 'would be included in the RIF in the supervisory or managerial position'), so Ortiz is a competing employee and had to be ranked on the register."

[[criterion]]
id = "q9_s4"
question = "Q9"
points = 2
text = "Step 4 does not comply: with a cutoff date 30 days before the notices (September 13, 2026), no rating put on record after the cutoff may be used (351.503(c)(2)); using one for a single employee also breaks the requirement that ratings be used uniformly and consistently within the competitive area (351.503(c)(4)). The cutoff point is required; the uniformity point alone is not enough."

[[criterion]]
id = "q9_s5"
question = "Q9"
points = 2
text = "Step 5 does not comply: for an employee with two ratings of record the missing rating gets a proxy value equal to the average of the two actual values (351.503(f)(2)): (7 + 5) / 2 = 6, so Quist's performance credit is 7 + 5 + 6 = 18, not 15. The figure 18 (or proxy 6) is required."

[[criterion]]
id = "q9_s6"
question = "Q9"
points = 2
text = "Step 6 does not comply: where all competing employees are under a single pattern, 351.503(d) lets an agency add points for recognized exceptional performance only under an appraisal system whose highest summary level is Level 3 (pass/fail, or old pattern D); under a five-level pattern the credit must be calculated as in 351.503(a) with no additional points. (351.503(e) transmutation applies only where there is more than one pattern.) Advance written criteria do not cure this. No if the answer says the step is in order because the policy was documented in advance."

[[criterion]]
id = "q9_s8"
question = "Q9"
points = 2
text = "Step 8 does not comply: 351.602(a) forbids releasing a competing employee from a competitive level while retaining in that level an employee with a specifically limited temporary or term promotion."

[[criterion]]
id = "q9_s10"
question = "Q9"
points = 2
text = "Step 10 does not comply: under 351.702(a)(4) the assessment of qualifications must allow demonstration of job-related skills, be based on a job analysis, and must not consist solely of, or principally rely on, an automated self-assessment."

[[criterion]]
id = "q9_s11"
question = "Q9"
points = 2
text = "Step 11 does not comply: temporary exceptions under 351.608 may not be sequenced or stacked (351.608(a)(3)); the agency may apply only the single exception that gives the longest retention, The no-stacking rule is the only required element. Adding that each of the undue-interruption exception (351.608(b)) and the general exception is limited to 90 days, so only one exception of at most 90 days is available, or mentioning the written notice to higher-standing employees for an exception over 30 days (351.608(a)(4)), is welcome but not required."

[[criterion]]
id = "q9_s12"
question = "Q9"
points = 2
text = "Step 12 does not comply: because the notices were issued on or after September 2, 2026, the appeal goes to OPM under 5 CFR part 351, subpart I (351.901, 351.902; FR Doc. 2026-15666), not to the Merit Systems Protection Board; citing 351.802(a)(6) as amended by 2026-15666 (the notice must name OPM) or the appeals rule's DATES paragraph is equally good. (The 30-calendar-day period from the effective date is itself correct.)"

[[criterion]]
id = "q9_ok"
question = "Q9"
points = 2
text = "Says that steps 2, 7 and 9 are all in order, and gives the deciding provision for at least two of them: step 2, an employee serving an initial probationary period is not a competing employee and may be retained while a competing employee is released (351.202(d)(2)-(3)); step 7, when employees are tied on credit, tenure subgroup and service date the agency may select any of them for release (351.601(c)); step 9, no assessment is required where within the five years before the notice the employee held the same position and was rated Level 3 or higher in it (351.702(a)(4)(v))."

[[criterion]]
id = "q9_false2"
question = "Q9"
kind = "penalty"
points = 2
text = "Says that step 2 (keeping the probationary employee Novak while releasing a career employee) does not comply with the rules."

[[criterion]]
id = "q9_false7"
question = "Q9"
kind = "penalty"
points = 2
text = "Says that step 7 (the director choosing between two fully tied employees) does not comply with the rules."

[[criterion]]
id = "q9_false9"
question = "Q9"
kind = "penalty"
points = 2
text = "Says that step 9 (offering Silva the position without an assessment) does not comply with the rules."

