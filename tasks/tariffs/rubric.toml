points = 0.75
text = "(f) Says the proposal listed informational materials (e.g. books) and donations as exemptions, while the adopted readable text does not mention informational materials or donations. Q9(f) does not ask about baggage: comparing the proposal's accompanied baggage with note 52(a)'s products for personal use in accompanied baggage, or saying that an image-only list could not be checked, is welcome but not required. No if the answer says the adopted text exempts informational materials or donations."

