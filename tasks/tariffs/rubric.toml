# Applied to every question; ids become e.g. "q3_cite".
[[per_question_penalty]]
suffix = "cite"
points = 1
text = "Citation discipline: a substantial share of the factual claims in this answer have no FR document number, proclamation clause, note subdivision or FR page citation."

[[per_question_penalty]]
suffix = "fab"
points = 2
text = "Fabrication: the answer invents a source. Yes only for (i) an FR document number, FR page citation, proclamation number or clause that does not exist; (ii) a quotation, in quotation marks, that does not appear in the cited source; (iii) a provision, statement or figure attributed to a source that has no basis anywhere in that source; or (iv) specific annex content (HTS numbers, product lists) asserted as fact although the annexes are images the tools cannot read. Not fabrication: misreading, misapplying or overstating the scope of a real provision, a wrong inference from real text, an arithmetic slip, or misnumbering a real clause that is otherwise described correctly. Those errors lose the related credit criteria instead. Check citations the key does not cover with the tools before answering yes."

# --------------------------------------------------------------------------- Q1
[[criterion]]
id = "q1_duty_procs"
question = "Q1"
points = 1.5
text = "Lists the three duty proclamations with their numbers and FR document numbers: 11046 (2026-14991), 11047 (2026-14992) and 11048 (2026-14997), signed July 20, 2026 and published July 23, 2026. No if any of the three is missing or has a wrong document number or signing date."

[[criterion]]
id = "q1_details"
question = "Q1"
points = 1
text = "Gives, for at least eight of the ten documents, the correct FR first page (see the document table in the key) and a correct one-line description of what the document does."

[[criterion]]
id = "q1_delay"
question = "Q1"
points = 1
text = "Lists Proclamation 11056 (2026-17294), signed August 18, 2026 and published August 24, 2026, and says it moved the effective date of the three duties to 12:01 a.m. on August 22, 2026 (from August 19)."

[[criterion]]
id = "q1_exclusions"
question = "Q1"
points = 1.5
text = "Lists the three import exclusion proclamations 11061, 11062 and 11063 (2026-18835, 2026-18836, 2026-18837), signed September 8, 2026 and published September 14, 2026, and gives their operative time as 12:01 a.m. on September 29, 2026. No if any of the three is missing."

[[criterion]]
id = "q1_scope"
question = "Q1"
points = 1.5
text = "Lists the three scope proclamations with operative times: 11064 (2026-18838) and 11065 (2026-18839), signed September 8, 2026, applying from 12:01 a.m. on September 15, 2026; and 11076 (2026-22292), signed October 23, 2026 and published October 30, 2026, applying from 12:01 a.m. on October 30, 2026. No if any of the three is missing or has a wrong operative date."

[[criterion]]
id = "q1_events"
question = "Q1"
points = 1
text = "Says that the duties and the scope changes are measured against entry for consumption or withdrawal from warehouse for consumption, while the import exclusions are measured against importation (goods 'imported on or after'). Both halves are required."

[[criterion]]
id = "q1_dairy_none"
question = "Q1"
points = 1
text = "Says that no proclamation modified the scope of the dairy duty list: the alcohol list was modified by 11064 and the motor-vehicles list by 11065 and 11076, and for dairy there is only the exclusion (11062). Mentioning that the exclusion proclamations moved some products from duty to exclusion is welcome but not required. No if the answer attributes a dairy scope modification to any document."

[[criterion]]
id = "q1_dairy_xref"
question = "Q1"
points = 0.5
text = "Notes that Proclamation 11062, clause (3), refers to a September 8, 2026 proclamation modifying the scope of the dairy duties, and that no such proclamation appears in the Federal Register."

# --------------------------------------------------------------------------- Q2
[[criterion]]
id = "q2a_zero"
question = "Q2"
points = 1
text = "(a) Says no section 338 duty ($0) is owed on entry 1 (August 20) and on entry 2 (11:59 p.m. August 21). No if either is given as dutiable."

[[criterion]]
id = "q2a_third"
question = "Q2"
points = 1
text = "(a) Says entry 3 (12:01 a.m. August 22) owes 50% of $40,000 = $20,000."

[[criterion]]
id = "q2a_basis"
question = "Q2"
points = 0.5
text = "(a) Cites Proclamation 11056, clause (1) (the effective date of the duties 'shall be 12:01 a.m. eastern time on August 22, 2026'), FR Doc. 2026-17294 or 91 FR 54790."

[[criterion]]
id = "q2b_chapeau"
question = "Q2"
points = 1
text = "(b) Says that 11056 formally amended only the chapeau of Annex II (of the alcoholic-beverages proclamation, or of each of the three; either is enough) (deleting 'August 19, 2026' and inserting 'August 22, 2026'), and that the numbered clauses of the duty proclamations that state August 19 (clause (1), and clause (3)) were not themselves amended. Naming clause (1) alone as the unamended text is enough."

[[criterion]]
id = "q2b_resolve"
question = "Q2"
points = 1
text = "(b) Says what resolves the leftover August 19 text: the first sentence of 11056 clause (1), which sets the effective date outright, and/or 11056 clause (5), under which inconsistent provisions of previous proclamations are superseded to the extent of the inconsistency. Either is enough."

[[criterion]]
id = "q2c_refund"
question = "Q2"
points = 1
text = "(c) Cites 11056 clause (4): to the extent implementation requires a refund of duties collected, refunds are processed under applicable law and CBP's standard procedures. Adding that clause (2) tells agencies to suspend collection, or that no special procedure or deadline is given, is welcome but not required. No if the answer says the documents are silent on refunds."

[[criterion]]
id = "q2d_no_action"
question = "Q2"
points = 0.75
text = "(d) Says no further presidential action was needed or issued for the duties to begin: 11056 only reset the effective date, and later proclamations (11061 recital 4, or the same recital in 11062-11065 or 11076) say the 3-day suspension lapsed at 12:01 a.m. on August 22, 2026 and the duties became effective."

[[criterion]]
id = "q2d_reneged"
question = "Q2"
points = 0.75
text = "(d) Says what the documents report about the days before: the delay was granted after Canada expressed a commitment to remove the discrimination, and on August 21, 2026 Canada reneged on that commitment, per the recitals of the September 8 proclamations (for example 11061 recital 3, 91 FR 58311). The August 21 date and the reneging are required; the earlier commitment to remove the discrimination, and that Canada ceased negotiating in good faith, are welcome but not required."

[[criterion]]
id = "q2e_thirty"
question = "Q2"
points = 1
text = "(e) Explains August 19 from the recited section 338 rule that additional duties may not take effect earlier than 30 days after the President's proclamation: July 20, 2026 plus 30 days is August 19, 2026."

# --------------------------------------------------------------------------- Q3
[[criterion]]
id = "q3a_shipment_a"
question = "Q3"
points = 0.5
text = "(a) Shipment A (arrives September 10, entered September 14): may be imported, and owes 50% of $30,000 = $15,000."

[[criterion]]
id = "q3a_shipment_b"
question = "Q3"
points = 1.5
text = "(a) Shipment B (arrives September 27, withdrawn from warehouse October 5): not excluded, and owes $15,000, because it was imported before September 29 and 11061 clause (2) keeps goods imported but not yet entered or withdrawn before September 29 at the 50% duty. No if the answer treats it as excluded or as owing no duty."

[[criterion]]
id = "q3a_shipment_c"
question = "Q3"
points = 1.5
text = "(a) Shipment C (arrives 11:30 p.m. September 28, entry filed September 29): not excluded, because the exclusion turns on importation and it was imported before 12:01 a.m. on September 29; owes $15,000. No if the answer treats it as excluded because the entry was filed on September 29."

[[criterion]]
id = "q3a_shipment_d"
question = "Q3"
points = 1.5
text = "(a) Shipment D (arrives 12:30 a.m. September 29): excluded from importation under 11061 clause (1) (imported on or after 12:01 a.m. on September 29, 2026), so it cannot be entered for consumption. No if the answer has it admitted on payment of the 50% duty."

[[criterion]]
id = "q3b_result"
question = "Q3"
points = 1.5
text = "(b) Concludes, as the best or likely reading, that shipment E is not excluded and owes the 50% duty ($15,000) when entered from the zone on October 6, because it was imported before September 29 and had not yet been entered for consumption, which is the case 11061 clause (2) describes. Yes whether stated as likely or as settled."

[[criterion]]
id = "q3b_ftz"
question = "Q3"
points = 1
text = "(b) Either cites the foreign-trade-zone clause of the duty proclamation (11046 clause (4): admission in privileged foreign status, with the duty owed on entry for consumption), or states that the exclusion proclamation does not itself address foreign trade zones. Either is enough."

[[criterion]]
id = "q3c_invalid"
question = "Q3"
points = 1.5
text = "(c) Says the 50% duty imposed by Proclamation 11046 applies to imports to which the invalidated exclusion had applied, citing 11061 clause (9)(b) (or 91 FR 58313). No if the answer says the goods would enter free of the section 338 duty."

[[criterion]]
id = "q3d_no_change"
question = "Q3"
points = 1
text = "(d) Says no: under 11061 clause (3) the proclamation does not otherwise affect the products subject to the Proclamation 11046 duty, so listed products outside the exclusion Annex remain subject to the 50% duty."

# --------------------------------------------------------------------------- Q4
[[criterion]]
id = "q4a_amounts"
question = "Q4"
points = 2
text = "(a) For entries on September 10, 2026: section 232 duty $25,000 and section 338 duty $0 on each of X, Y and Z. No if any of the three is given a section 338 duty."

[[criterion]]
id = "q4a_basis"
question = "Q4"
points = 1
text = "(a) Bases the $0 on clause (2) of the duty proclamations (11046, 11047, 11048): the duties 'shall not apply to articles subject to duties pursuant to section 232'. No if the only reason given is that the duties had not yet started."

[[criterion]]
id = "q4b_x"
question = "Q4"
points = 1.5
text = "(b) Product X on October 1, 2026: section 232 duty $25,000 and section 338 duty $50,000, because Proclamation 11064 makes the 11046 duty apply in addition to section 232 duties from September 15, 2026."

[[criterion]]
id = "q4b_z"
question = "Q4"
points = 1.5
text = "(b) Product Z on October 1, 2026: section 232 duty $25,000 and section 338 duty $50,000, because Proclamation 11065 makes the 11048 duty apply in addition to section 232 duties from September 15, 2026."

[[criterion]]
id = "q4b_y"
question = "Q4"
points = 2
text = "(b) Product Y on October 1, 2026: section 232 duty $25,000 and section 338 duty $0, because no document modified Proclamation 11047 and its clause (2) carve-out for section 232 articles still applies. Yes also if the answer gives $0 as the result on the published text and flags doubt about it. No if the answer gives Y a $50,000 section 338 duty, or gives both figures without choosing $0 as the answer on the text."

[[criterion]]
id = "q4c_text"
question = "Q4"
points = 1.5
text = "(c) Identifies both pieces of deciding text: clause (2) of the duty proclamations (carve-out for articles subject to section 232 duties) and the sentence in clause (1) of Proclamations 11064 and 11065 that the duties 'shall apply in addition to duties imposed pursuant to section 232', effective for entries on or after 12:01 a.m. on September 15, 2026."

[[criterion]]
id = "q4c_supersede"
question = "Q4"
points = 0.5
text = "(c) Shows how the conflict between clause (2) of the duty proclamations and the stacking clause of 11064 and 11065 is resolved, in any of these ways: notes that the September proclamations do not expressly amend or repeal clause (2); cites or quotes their supersession clause (inconsistent provisions of earlier proclamations are superseded to the extent of the inconsistency); or says that the later stacking clause displaces or overrides clause (2) from September 15. Any one is enough. Q4(c) asks only for the deciding text, so an answer that cites both clause (2) and the stacking clause with their FR pages and applies the later one from September 15 also earns this."

[[criterion]]
id = "q4c_xref"
question = "Q4"
points = 0.5
text = "(c) Points out that Proclamation 11062, clause (3), refers to a September 8, 2026 proclamation 'Modifying the Scope ... With Respect to Dairy' and that no such proclamation has been published in the Federal Register."

[[criterion]]
id = "q4c_doubt"
question = "Q4"
points = 0.5
text = "(c) Says that this leaves some doubt about, or qualifies, the answer for Y (for example: the result rests on the absence of a dairy modification document, or a dairy modification with the same stacking sentence appears to have been contemplated). No if the answer presents all six results as free of doubt."

