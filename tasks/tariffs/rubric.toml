# -------------------------------------------------------------------------- Q13
[[criterion]]
id = "q13a"
question = "Q13"
points = 2.5
text = "(a) $35,000: under clause (2)(d) of Proclamation 11032 (FR Doc. 2026-11314, 91 FR 34087) the 25 percent duty applies only to the non-U.S. content of a USMCA-qualifying product of Canada: ($200,000 - $60,000) x 25% = $35,000, which is 17.5 percent of the value and so above the 15 percent minimum. The amount and clause (2)(d) (or the proclamation and its non-U.S. content rule) are required."

[[criterion]]
id = "q13b"
question = "Q13"
points = 1
text = "(b) $50,000: with no U.S. content the non-U.S. content is the whole value; 25% x $200,000."

[[criterion]]
id = "q13c"
question = "Q13"
points = 2
text = "(c) $50,000: a product of Canada that does not qualify for USMCA treatment gets no reduction for U.S. content; the 25 percent rate of clause (2)(a) applies to the full customs value (Proclamation 11021, clause (1): the full customs value regardless of metal content). No if the answer deducts the U.S. parts ($35,000)."

[[criterion]]
id = "q13d"
question = "Q13"
points = 2
text = "(d) $25,000: under clause (2)(b) of Proclamation 11032 products of Japan pay a section 232 rate such that the Column 1 rate plus the section 232 rate equals 15 percent: (15% - 2.5%) x $200,000 = $25,000."

[[criterion]]
id = "q13e"
question = "Q13"
points = 2.5
text = "(e) $37,500: for entries on or after October 14, 2026 the Department of Commerce guidance (FR Doc. 2026-20938, 91 FR 65162) defines U.S. content as the value attributable to parts wholly obtained, entirely produced or substantially transformed in the United States plus, to the extent not already counted, the value attributable to steel melted and poured, or aluminum or copper smelted and cast, in the United States. U.S. content is $20,000 + $30,000 = $50,000; ($200,000 - $50,000) x 25% = $37,500 (18.75 percent, above the minimum). The amount and the Commerce notice are required. No if the answer gives $45,000."

[[group]]
id = "q13f_group"
question = "Q13"
gate = "q13f_flag"
factor = 0.5

[[criterion]]
id = "q13f"
question = "Q13"
group = "q13f_group"
points = 1
text = "(f) Says the Commerce guidance applies only to goods entered on or after October 14, 2026, so for an entry on October 6 the answer rests on the proclamation's own definition (non-U.S. content is total value minus the value attributable to parts produced in the United States): on that text $20,000 counts and the duty is ($200,000 - $20,000) x 25% = $45,000, and whether the U.S.-smelted aluminum in a Canadian part could count before October 14 is not settled by the documents. Yes if the answer gives $45,000 on this reasoning (whether or not it flags the doubt; that is handled by the q13f_flag gate), or sets out both $45,000 and $37,500 and explains that the date of the guidance is what separates them. An answer that gives $45,000 from the proclamation's definition earns yes even if it did not find the Commerce guidance (or says no later document changed the rule): the October 6 figure rests on the proclamation, and missing the guidance is scored in q13e and in the q13f_flag gate. No if it gives $37,500 with no mention of the October 14 date."

[[criterion]]
id = "q13f_flag"
question = "Q13"
kind = "gate"
text = "(f) Flags that the documents do not settle whether the U.S.-smelted aluminum could count as U.S. content before October 14, 2026, or sets out both $45,000 and $37,500 with the October 14 date as what separates them. No if the answer presents its (f) figure as certain with no such caveat."

[[criterion]]
id = "q13g"
question = "Q13"
points = 2
text = "(g) $30,000: 25% of the non-U.S. content is $15,000, only 7.5 percent of the value, and clause (2)(d) says the total effective duty assessed under it 'shall not be less than 15 percent ad valorem', so the duty is 15% x $200,000 = $30,000. Yes also if the answer gives $30,000 as the better reading and notes that the detail of the minimum is in Annex IV, which is published as an image. No if the answer gives $15,000 without applying the minimum."

[[criterion]]
id = "q13h"
question = "Q13"
points = 1
text = "(h) The clause (2) rates apply through 11:59 p.m. eastern standard time on December 31, 2027; from 12:01 a.m. on January 1, 2028 the rates of clause (3) of Proclamation 11021 apply to Annex I-C products (clause (3)(a) of Proclamation 11032). (Clause (3) of Proclamation 11021 sets 25 percent unless a lower rate applies.) The end date and the reversion to Proclamation 11021 are both required."

# -------------------------------------------------------------------------- Q14
[[criterion]]
id = "q14_1_operative"
question = "Q14"
points = 1
text = "Statement 1: incorrect, or partly correct with the explanation that the date appears only in a recital (either label is yes). The operative text of the memorandum (section 2) directs the quotas 'as soon as the Trade Representative determines that it is feasible' and sets no deadline; 'feasible by September 1, 2026' appears only in a recital reporting the Trade Representative's advice (91 FR 47720)."

[[criterion]]
id = "q14_1_notice"
question = "Q14"
points = 1
text = "Statement 1: adds at least one of these: the USTR notice gives no date (any statement that the notice sets no deadline is enough) or says the mechanism will be established in a subsequent notice (91 FR 47334-47335); no such notice has been published as of November 14, 2026; in the meantime the textile and apparel goods concerned pay the 10 percent rate (memorandum section 2(c))."

[[criterion]]
id = "q14_2"
question = "Q14"
points = 1.5
text = "Statement 2: incorrect. Over 450 comments and nearly 60 witnesses (hearings of April 28-29, 2026) are the figures for the earlier, investigation phase, reported in the June proposal (91 FR 34273). On the proposed action USTR received over 1,600 written comments and heard over 100 witnesses at a three-day hearing on July 7-9, 2026 (91 FR 47319). Yes if the answer gives the 1,600 and 100 figures for the proposed action with their source; explaining that the 450 and 60 figures belong to the investigation phase is welcome but not required."

[[criterion]]
id = "q14_3_jordan"
question = "Q14"
points = 1
text = "Statement 3: says Jordan did not adopt an import ban; its 10 percent rate rests on commitments in an agreement on reciprocal trade, while Cambodia, Guatemala, Honduras, India, Sri Lanka and Trinidad and Tobago imposed bans after the June proposal (91 FR 47319; memorandum, 91 FR 47720)."

[[criterion]]
id = "q14_3_five"
question = "Q14"
points = 1
text = "Statement 3: says not all seven moved from 12.5 percent: Cambodia and Guatemala were already proposed at 10 percent in June (because of trade-agreement commitments), so only Honduras, India, Jordan, Sri Lanka and Trinidad and Tobago moved from 12.5 to 10 percent."

[[criterion]]
id = "q14_4"
question = "Q14"
points = 1
text = "Statement 4: incorrect. USTR 'determined not to remove these products from the list of exempted products' (beef, avocados, paprika, lithium hexafluorophosphate, forgings), citing limited availability from domestic sources (91 FR 47330-47331)."

[[criterion]]
id = "q14_5"
question = "Q14"
points = 1.5
text = "Statement 5: incorrect. The net-of-MFN economies are the European Union, Taiwan, Japan, South Korea and Switzerland; economy-specific exemptions exist for thirteen economies (Argentina, Bangladesh, Cambodia, Ecuador, El Salvador, the European Union, Guatemala, Indonesia, Jordan, Malaysia, Switzerland, Taiwan, the United Kingdom; 91 FR 47333, memorandum section 1(b)(v)), and Japan and South Korea are not among them. Naming Japan and South Korea (or either, with the list of thirteen) as lacking a list is required. No if the answer misstates which economies have their own lists (for example, says only the European Union, Switzerland and Taiwan have them)."

[[criterion]]
id = "q14_6"
question = "Q14"
points = 1
text = "Statement 6: partly correct. The 471 additional products are right (91 FR 47331), but for sugar the determinations add only 'certain sugar and sugar containing products' (91 FR 47331, 47333), not all sugar. Yes whether or not the answer adds the 'in-quota' wording from the notice's summary of comments."

[[criterion]]
id = "q14_7"
question = "Q14"
points = 1.5
text = "Statement 7: incorrect. The notice's phrase 'maximum tariffs of 12.5 percent' (91 FR 47334) refers to the section 301 rate; under note 52(a) the flat-rate duties are in addition to the general (MFN) rates and to other additional duties, so the total can exceed 12.5 percent (only the net-of-MFN economies have a combined ceiling)."

[[criterion]]
id = "q14_ok"
question = "Q14"
points = 2
text = "Says statements 8, 9 and 10 are all correct, citing a deciding passage for at least two: 8, the foreign trade zone paragraph of the notice (91 FR 47321); 9, section 4(e) of the memorandum (91 FR 47723) or part IV of the notice (91 FR 47335); 10, the Trade Representative determined to exempt all products proposed for exemption in Annex A 'except the non-pharmaceutical applications of certain chemical products' (91 FR 47330). An answer that calls 10 correct for the Annex A list and adds that the proposal's wider exemptions (all section 232 goods, informational materials, donations) were also narrowed still counts as calling it correct, and so does an answer that calls 10 'partly correct' or 'misleading' for that reason, provided it agrees that the chemical products are the only cut-back among the products on the Annex A list."

[[criterion]]
id = "q14_false"
question = "Q14"
kind = "penalty"
points = 1.5
text = "Calls statement 8, statement 9 or statement 10 incorrect. (Calling statement 10 correct, or 'partly correct', as to the Annex A product list while noting that other proposed exemptions were narrowed is not calling it incorrect.)"

