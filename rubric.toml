# Machine-readable scoring rubric, derived from ANSWER_KEY.md.
#
# The grader agent gives a verdict ("yes", "no" or "unclear") for every
# criterion. grader.py turns verdicts into points; the grader never sees points.
#
#   kind = "credit"   yes earns `points`
#   kind = "penalty"  yes deducts `points`
#   kind = "gate"     no points; a group whose gate is not "yes" is multiplied
#                     by the group's `factor`
#
# Groups: `cap` limits the group's credit; `gate` + `factor` scale it.
# Ladders: "at least 1", "at least 2", ... criteria that count items. Only the
# unbroken run of "yes" from the first rung counts, and a ladder `within`
# another cannot count more than it. A "yes" that breaks either rule is scored
# as "unclear" and the ladder is listed in the report for human review.
# A question's score is (credits - penalties), clamped to [0, question points].
# For the headline score, "unclear" counts as "no". score_min / score_max
# resolve every "unclear" against / in favour of the submission.
#
# Where this file and the point split in ANSWER_KEY.md differ, this file
# decides the points. Criterion text should still be read with the key.

