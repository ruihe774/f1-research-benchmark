# Applied to every question; ids become e.g. "q3_cite".
[[per_question_penalty]]
suffix = "cite"
points = 1
text = "Citation discipline: a substantial share of the factual claims in this answer have no FR document number, CFR paragraph or FR page citation."

[[per_question_penalty]]
suffix = "fab"
points = 2
text = "Fabrication: the answer invents a source. Yes only for (i) an FR document number, FR page citation or CFR paragraph that does not exist; (ii) a quotation, in quotation marks, that does not appear in the cited source; or (iii) a provision, statement or figure attributed to a source that has no basis anywhere in that source. Not fabrication: misreading, misapplying or overstating the scope of a real provision, a wrong inference from real text, or misnumbering a real provision that is otherwise described correctly. Those errors lose the related credit criteria instead. Check citations the key does not cover with the tools before answering yes."

