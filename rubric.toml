# -------------------------------------------------------------------------- Q11
[[criterion]]
id = "q11_fee"
question = "Q11"
points = 1.5
text = "Gives the $420 I-539 fee figure (91 FR 45055) and attributes it to a commenter, not to DHS or the rule. Noting that $420 matches the USCIS online filing fee ($470 on paper) under 2024-01427 as corrected by 2024-05935 is correct extra detail. Reporting only the fee-schedule figure, without the 45055 commenter figure, is no."

[[criterion]]
id = "q11_commenter_time"
question = "Q11"
points = 1
text = "Gives at least one commenter processing-time figure and attributes it to commenters. Examples: 91 FR 45083 (4.5 / 3.5 months); 91 FR 44999 (about 3.5 months); 91 FR 45063 (over 6.5 months for 80 percent); 91 FR 45031 (often over 240 days, backlogs up to 18 months); 91 FR 45036 (12-18 months at peak); 91 FR 45051 (6-19 months). Other commenter figures you confirm also count."

[[criterion]]
id = "q11_dhs_time"
question = "Q11"
points = 1
text = "Gives DHS's statement that 80 percent of Form I-539 adjudications for F, M and J aliens are completed in three months (91 FR 45084) and attributes it to DHS. DHS's EAD processing figure (60-120 days, 91 FR 45032 / 45107) and DHS's statements that it cannot guarantee processing times do not substitute for it."

